version: 2

sources:
  - name: raw
    database: bigquery-public-data
    schema: thelook_ecommerce
    description: Synthetic e-commerce dataset (BigQuery)

    tables:
    - name: users
      description: One row per customer

    - name: orders
      description: One row per order header
      config:
        loaded_at_field: created_at
        freshness: 
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}

    - name: order_items
      description: One row per order line item
    
    - name: products
      description: product catalog

    - name: inventory_items
      description: unit-level inventory

    - name: distribution_centers
      description: Fulfillment locations
      


    - name: events
      description: Clickstream/session events
      config:
        loaded_at_field: created_at
        freshness: 
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}