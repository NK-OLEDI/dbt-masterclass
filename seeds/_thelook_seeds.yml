version: 2

seeds:
  - name: traffic_source_channel_mapping
    description: >
      Maps raw traffic_source values to broader paid/organic channel group used for seed.
    columns:
      - name: traffic_source
        description: These are the unique values for traffic_source column
        data_tests:
          - unique
          - not_null

      - name: channel_group
        description: Assined channel_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Paid', 'Organic']